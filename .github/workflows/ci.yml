name: Tech Lab Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU art test dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
      - run: python scripts/check_status.py --changes
      - run: python scripts/check_lab.py
      - run: python -m unittest discover -s tests -v
